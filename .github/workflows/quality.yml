name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    name: Static site smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check HTML references and metadata
        run: python scripts/check_site.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
